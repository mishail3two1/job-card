<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
 
  <article class="job-card">
 
    <div class="job-card__top">
      <div class="job-card__logo">
        <img class="job-card__logo-img" src="img/company-logo.svg" alt="Netflix logo" width="52" height="52">
        <img class="job-card__verified" src="img/verified.svg" alt="Verified company" width="16" height="16">
      </div>
 
      <button class="job-card__bookmark" type="button" aria-label="Save job">
        <img class="job-card__bookmark-icon" src="img/bookmark.svg" alt="" width="24" height="24">
      </button>
    </div>
 
    <h1 class="job-card__title">Стажер по продуктовому дизайну</h1>
    <p class="job-card__company">Netflix</p>
    <p class="job-card__location">Челябинск, Россия (гибрид)</p>
 
    <ul class="job-card__tags">
      <li class="tag">Стажировка</li>
      <li class="tag">Начальный уровень</li>
      <li class="tag">Оплачиваемая</li>
      <li class="tag">Полная занятость</li>
    </ul>
 
    <div class="job-card__footer">
      <span class="job-card__date">2 дня назад</span>
      <a class="job-card__applicants" href="#">1 отклик</a>
    </div>
 
  </article>
 
</body>
</html>
